name: Build iOS IPA for Sideloadly

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: |
          npm ci || npm install

      - name: Prebuild Native iOS Project
        run: |
          npx expo prebuild --platform ios --clean

      - name: Patch Podfile for Code Signing
        run: |
          # Chèn cấu hình tắt ký số vào ngay sau dòng post_install có sẵn
          sed -i '' '/post_install do |installer|/a\
            installer.pods_project.targets.each { |t| t.build_configurations.each { |c| c.build_settings["CODE_SIGNING_ALLOWED"] = "NO" } }
          ' ios/Podfile

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build App (Skip Code Signing)
        run: |
          cd ios
          xcodebuild -workspace ReactFood.xcworkspace \
            -scheme ReactFood \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          mkdir -p build/Payload
          cp -r build/Build/Products/Release-iphoneos/ReactFood.app build/Payload/
          cd build
          zip -r -y ReactFood.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReactFood-IPA
          path: ios/build/ReactFood.ipa