name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          xcodebuild -version

      - name: Install dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: Expo Prebuild (Generate iOS Native Project)
        run: |
          npx expo prebuild --platform ios --clean

      - name: Patch Xcode Project & Podfile for Unsigned Build
        run: |
          cd ios
          # 1. Tắt sandbox và signing trên file dự án Xcode gốc
          sed -i '' 's/ENABLE_USER_SCRIPT_SANDBOXING = YES;/ENABLE_USER_SCRIPT_SANDBOXING = NO;/g' ReactFood.xcodeproj/project.pbxproj || true

          # 2. Can thiệp Podfile bằng script Ruby chuẩn để tắt toàn bộ kiểm tra chứng chỉ
          ruby -e '
            path = "Podfile"
            content = File.read(path)
            injection = %(
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                  config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                  config.build_settings["EXPANDED_CODE_SIGN_IDENTITY"] = ""
                  config.build_settings["ENABLE_USER_SCRIPT_SANDBOXING"] = "NO"
                end
              end
            )
            if content.include?("post_install do |installer|")
              content.sub!("post_install do |installer|", "post_install do |installer|\n" + injection)
            else
              content << "\npost_install do |installer|\n" + injection + "\nend\n"
            end
            File.write(path, content)
          '

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Compile iOS Binary (Release, Unsigned)
        run: |
          cd ios
          xcodebuild build \
            -workspace ReactFood.xcworkspace \
            -scheme ReactFood \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package Payload into IPA
        run: |
          cd ios
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app found in build directory!"
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -y ReactFood.ipa Payload
          ls -lh ReactFood.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReactFood-IPA
          path: ios/ReactFood.ipa
          if-no-files-found: error
          retention-days: 14
